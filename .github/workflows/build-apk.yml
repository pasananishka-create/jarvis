name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        run: npm ci && npm run build && npx cap sync android
        working-directory: frontend

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;36.0.0"

      - name: Debug Java
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          java -version 2>&1
          which java
          ls -la $JAVA_HOME/bin/jlink 2>/dev/null || echo "NO JLINK in JAVA_HOME"
          find / -name "jlink" -type f 2>/dev/null | head -5

      - name: Build
        run: |
          cd frontend/android
          chmod +x gradlew
          export JAVA_HOME=$JAVA_HOME
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: frontend/android/app/build/outputs/apk/debug/
