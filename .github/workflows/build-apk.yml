name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        env:
          NODE_OPTIONS: "--no-deprecation"
        run: npm ci && npm run build && npx cap sync android
        working-directory: frontend

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        env:
          NODE_OPTIONS: "--no-deprecation"
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "J.A.R.V.I.S. APK" \
            --notes "Auto-built from \`main\` branch — [Download APK](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)" \
            --latest \
            2>/dev/null || true
          gh release upload latest \
            frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber
