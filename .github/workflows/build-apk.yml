name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
          npx cap sync android
        working-directory: frontend

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(stat -c%s "$APK") bytes"
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            --title "J.A.R.V.I.S. APK" \
            --notes "Auto-built from commit \`${{ github.sha }}\` on \`main\` branch." \
            --latest
          gh release upload latest "$APK" --clobber
          echo "::notice::APK published! Download: https://github.com/${{ github.repository }}/releases/latest"
