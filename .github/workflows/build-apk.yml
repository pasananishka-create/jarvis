name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>&1 || true
          echo "SDK installed"

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        working-directory: frontend/android
        continue-on-error: true

      - name: Upload APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            frontend/android/app/build/reports/
            frontend/android/.gradle/
          if-no-files-found: ignore
