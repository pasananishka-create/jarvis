name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-36" "build-tools;36.0.0" 2>&1

      - name: Build APK
        run: |
          set -e
          chmod +x android/gradlew
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
          echo "=== BUILD DONE ==="
        working-directory: frontend

      - name: Package outputs
        run: |
          echo "=== Directory structure ==="
          find frontend/android -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"
          echo "=== Debug output ==="
          ls -la frontend/android/app/build/outputs/ 2>/dev/null || echo "No outputs/"
          ls -la frontend/android/app/build/outputs/apk/ 2>/dev/null || echo "No apk/"
          ls -la frontend/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug/"
          echo "=== Creating output ==="
          mkdir -p dist/apk
          find frontend/android -name "*.apk" -exec cp {} dist/apk/ \;
          ls -la dist/apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/apk/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: frontend/android/app/build/reports/
          if-no-files-found: ignore
